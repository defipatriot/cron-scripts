name: Ratio History Consolidate (one-time)

# One-time: folds every existing data/daily/{date}.json archive's `lst_ratios`
# into a single data/ratio-history.json time-series — recovering all the exact
# LST exchange-rate history captured so far. Idempotent + merge-safe (run
# alongside the cron's forward-append). Lives in network-and-prices-data_2026.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-history-consolidate
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consolidate ratio history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: node ratio-history-consolidate.js
